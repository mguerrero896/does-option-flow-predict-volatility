<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="timeline-title timeline-desc">
<title id="timeline-title">The programme from retrospective study to sealed future read</title>
<desc id="timeline-desc">A timeline: retrospective discovery and validation, one sealed prospective read already consumed, a cohort still collecting, and a preregistered read scheduled for 2029.</desc>
