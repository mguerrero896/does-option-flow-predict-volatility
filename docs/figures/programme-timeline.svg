<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="56" y1="188" x2="824" y2="188" stroke="#c9d2da" stroke-width="2"/>
<circle cx="108" cy="188" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.4"/>
<line x1="108" y1="168" x2="108" y2="180" stroke="#c9d2da" stroke-width="1"/>
<circle cx="268" cy="188" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.4"/>
<line x1="268" y1="168" x2="268" y2="180" stroke="#c9d2da" stroke-width="1"/>
<circle cx="436" cy="188" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.4"/>
<line x1="436" y1="208" x2="436" y2="196" stroke="#c9d2da" stroke-width="1"/>
<circle cx="596" cy="188" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.4"/>
<line x1="596" y1="208" x2="596" y2="196" stroke="#c9d2da" stroke-width="1"/>
<circle cx="768" cy="188" r="8" fill="#ffffff" stroke="#e8a33d" stroke-width="2.4"/>
<circle cx="768" cy="188" r="3.5" fill="#e8a33d"/>
<line x1="768" y1="208" x2="768" y2="196" stroke="#c9d2da" stroke-width="1"/>
<text x="32" y="30" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.14em">WHEN IT WAS TESTED</text><text x="32" y="62" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600">One read is spent, one is collecting, one is sealed until 2029</text><text x="32" y="88" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">A sealed cohort opens exactly once, under a protocol written before it existed.</text>
<text x="108" y="104" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="0.06em">2024–2026</text><text x="108" y="126" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Discovery</text><text x="108" y="144" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">retrospective</text>
<text x="268" y="104" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="0.06em">TO 2026-05</text><text x="268" y="126" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Validation</text><text x="268" y="144" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">not replicated</text>
<text x="436" y="232" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="0.06em">2026-08-30</text><text x="436" y="254" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Phase 8 read</text><text x="436" y="272" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">MIXED_EXPLORATORY</text>
<text x="596" y="232" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="0.06em">~2026-11</text><text x="596" y="254" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Phase 9</text><text x="596" y="272" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">still collecting</text>
<text x="768" y="232" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="0.06em">EST. 2029-01-30</text><text x="768" y="254" fill="#e8a33d" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">RP3 sealed read</text><text x="768" y="272" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">662 sessions</text>
<line x1="32" y1="280" x2="848" y2="280" stroke="#e1e6ea" stroke-width="1"/>
<rect x="32" y="292" width="12" height="12" rx="3" fill="#1a2332" stroke="none"/><text x="52" y="302" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">measured or consumed</text>
<rect x="188" y="292" width="12" height="12" rx="3" fill="#e8a33d" stroke="none"/><text x="208" y="302" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">sealed, not yet opened</text>
</svg>
