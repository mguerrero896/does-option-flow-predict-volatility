<svg xmlns="http://www.w3.org/2000/svg" width="880" height="624" viewBox="0 0 880 624" role="img" aria-labelledby="evidence-title evidence-desc">
<title id="evidence-title">Twelve contrasts against the threshold each one declared</title>
<desc id="evidence-desc">Each nested contrast registered a minimum detectable effect before it was measured. Three of twelve exceed their own threshold; two of those are option state and one is option flow.</desc>
