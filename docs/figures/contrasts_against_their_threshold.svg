<svg xmlns="http://www.w3.org/2000/svg" width="900" height="618" viewBox="0 0 900 618" role="img" aria-label="Twelve nested contrasts against the minimum detectable effect each declared">
<style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#1a2332}.t{font-size:19px;font-weight:700}.s{font-size:13px;fill:#6b7684}.row{font-size:12.5px}.ax{font-size:11px;fill:#6b7684}.k{font-size:11.5px}</style>
