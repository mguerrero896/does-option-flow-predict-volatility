<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" role="img" aria-labelledby="eligibility-gates-title eligibility-gates-desc">
<title id="eligibility-gates-title">The three permissions this project checks before a number becomes a claim</title>
<desc id="eligibility-gates-desc">The scientific result is reportable after custody validation; edge and capital promotion remain withheld.</desc>
<defs><marker id="head" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6570"/></marker><marker id="head-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e8a33d"/></marker><marker id="head-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#123c69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="138" width="800" height="96" rx="8" fill="#ffffff" stroke="#c9d2da" stroke-width="1.4"/><rect x="40" y="138" width="5" height="96" rx="2.5" fill="#1a2332"/>
<rect x="40" y="250" width="800" height="96" rx="8" fill="#ffffff" stroke="#c9d2da" stroke-width="1.4"/><rect x="40" y="250" width="5" height="96" rx="2.5" fill="#1a2332"/>
<rect x="40" y="362" width="800" height="96" rx="8" fill="#ffffff" stroke="#c9d2da" stroke-width="1.4"/><rect x="40" y="362" width="5" height="96" rx="2.5" fill="#1a2332"/>
<rect x="40" y="480" width="800" height="60" rx="8" fill="#fdf6ea" stroke="#e8a33d" stroke-width="1.4"/>
<text x="32" y="30" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.14em">WHY YOU CAN TRUST IT</text><text x="32" y="62" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600">One reportable result; no edge or capital promotion</text><text x="32" y="88" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">The one-shot result stays visible without being promoted beyond its frozen rules.</text>
<text x="70" y="172" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Is the one-shot scientific result reportable?</text><text x="70" y="200" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">Yes. Frozen result, log, ledger, and content-addressed payloads passed custody validation.</text><rect x="758" y="168" width="52" height="26" rx="13" fill="#f5f7f9" stroke="#1a2332" stroke-width="1.4"/><text x="784" y="186" fill="#1a2332" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">YES</text>
<text x="70" y="284" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Does it establish a global option-information edge?</text><text x="70" y="312" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">No. No registered estimate met its frozen MDE; no binary edge-promotion rule was registered.</text><rect x="758" y="280" width="52" height="26" rx="13" fill="#f5f7f9" stroke="#1a2332" stroke-width="1.4"/><text x="784" y="298" fill="#1a2332" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">NO</text>
<text x="70" y="396" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600">May it authorize capital or live trading?</text><text x="70" y="424" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">No. The result is research-only, observational and not evidence of live trading profitability.</text><rect x="758" y="392" width="52" height="26" rx="13" fill="#f5f7f9" stroke="#1a2332" stroke-width="1.4"/><text x="784" y="410" fill="#1a2332" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">NO</text>
<text x="70" y="506" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Scientific result eligible; global edge not confirmed.</text><text x="70" y="527" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">One authorized OOS read, zero retuning, and no second execution permitted.</text>
<text x="40" y="556" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">Every number stays auditable; scientific eligibility does not imply an edge or capital claim.</text>
<text x="40" y="574" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">Machine status: CURRENT_ELIGIBLE_SCIENTIFIC_RESULT_EDGE_NOT_CONFIRMED.</text>
</svg>
