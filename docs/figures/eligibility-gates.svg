<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="eligibility-title eligibility-desc">
<title id="eligibility-title">How a measurement becomes an eligible claim, or does not</title>
<desc id="eligibility-desc">A measurement passes three gates: its method must have been frozen and hashed before any outcome was seen, its cohort must be opened only under an authorised one-shot read, and its point-in-time inputs must reconcile. Failing any gate keeps the number auditable but not current.</desc>
<defs><marker id="head" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6570"/></marker><marker id="head-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e8a33d"/></marker><marker id="head-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#123c69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="272" y1="164" x2="320" y2="164" stroke="#5a6570" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="556" y1="164" x2="604" y2="164" stroke="#5a6570" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="724" y1="196" x2="724" y2="264" stroke="#5a6570" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="736" y="221" width="34" height="18" rx="3" fill="#ffffff"/><text x="744" y="234" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">yes</text>
<line x1="724" y1="332" x2="724" y2="400" stroke="#e8a33d" stroke-width="1.6" marker-end="url(#head-accent)"/>
<rect x="736" y="357" width="34" height="18" rx="3" fill="#ffffff"/><text x="744" y="370" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">yes</text>
<path d="M 608 300 H 520 Q 512 300 512 308 V 396" fill="none" stroke="#5a6570" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head)"/><rect x="450" y="330" width="60" height="18" rx="3" fill="#ffffff"/><text x="480" y="344" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">no</text>
<text x="32" y="30" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.14em">WHY YOU CAN TRUST IT</text><text x="32" y="62" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Three gates, and what happens when one does not open</text><text x="32" y="88" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">The canonical state refuses to promote a measurement it cannot support.</text>
<rect x="40" y="132" width="232" height="64" rx="6" fill="#ffffff"/><rect x="40" y="132" width="232" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="156" y="160" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">A measurement</text><text x="156" y="180" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">produced by a run</text>
<rect x="324" y="132" width="232" height="64" rx="6" fill="#ffffff"/><rect x="324" y="132" width="232" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="440" y="160" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Method frozen first?</text><text x="440" y="180" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">hashed before any outcome</text>
<rect x="608" y="132" width="232" height="64" rx="6" fill="#ffffff"/><rect x="608" y="132" width="232" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="724" y="160" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Read authorised?</text><text x="724" y="180" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">sealed cohort, opened once</text>
<rect x="608" y="268" width="232" height="64" rx="6" fill="#ffffff"/><rect x="608" y="268" width="232" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="724" y="296" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">PIT inputs reconcile?</text><text x="724" y="316" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">availability proven</text>
<rect x="608" y="404" width="232" height="64" rx="6" fill="#ffffff"/><rect x="608" y="404" width="232" height="64" rx="6" fill="#fdf6ea" stroke="#e8a33d" stroke-width="1.2"/><text x="724" y="432" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Eligible claim</text><text x="724" y="452" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">may be stated as current</text>
<rect x="40" y="404" width="448" height="64" rx="6" fill="#ffffff"/><rect x="40" y="404" width="448" height="64" rx="6" fill="#f5f7f9" stroke="#c9d2da" stroke-width="1.2"/><text x="264" y="432" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Historical measurement</text><text x="264" y="452" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">auditable, never a current claim</text>
<text x="32" y="512" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">The current bundle stops at the third gate, so its numbers stay historical. That is the state the repository publishes.</text>
<line x1="32" y1="512" x2="848" y2="512" stroke="#e1e6ea" stroke-width="1"/>
<rect x="32" y="524" width="12" height="12" rx="3" fill="#e8a33d" stroke="none"/><text x="52" y="534" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">eligible as a current claim</text>
<rect x="232" y="524" width="12" height="12" rx="3" fill="#c9d2da" stroke="none"/><text x="252" y="534" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">retained for audit</text>
</svg>
