<text x="920" y="502" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#5a6570" font-weight="400" text-anchor="middle">p = 0.6280</text>
<text x="920" y="538" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#5a6570" font-weight="400" text-anchor="middle">No clear improvement</text>
<line x1="40" y1="612" x2="1160" y2="612" stroke="#e1e6ea" stroke-width="1"/>
<text x="40" y="646" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#1a2332" font-weight="600" text-anchor="start">Six stocks · 419 historical sessions · 15-minute forecasts</text>
<text x="40" y="677" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#5a6570" font-weight="400" text-anchor="start">One-sided tests in sequence within each family. These sessions were reused across designs.</text>
<text x="40" y="705" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#5a6570" font-weight="400" text-anchor="start">The final 25-session window does not confirm the full sequence. Forecast skill is not trading profit.</text>
