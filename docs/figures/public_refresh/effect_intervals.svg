<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="which-information-improves-the-forecast?-title which-information-improves-the-forecast?-desc">
<title id="which-information-improves-the-forecast?-title">Which information improves the forecast?</title>
