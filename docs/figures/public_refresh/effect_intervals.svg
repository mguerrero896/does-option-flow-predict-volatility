<text x="780" y="496" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#1a2332" font-weight="400" text-anchor="middle">Baseline loss − expanded-model loss (QLIKE)</text>
<text x="40" y="550" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#1a2332" font-weight="400" text-anchor="start">Right of zero = lower forecast loss. These are not investment returns.</text>
<text x="40" y="582" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#5a6570" font-weight="400" text-anchor="start">Intervals are descriptive percentile intervals; decisions use the declared one-sided sequence.</text>
