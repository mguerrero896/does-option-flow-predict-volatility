<svg xmlns="http://www.w3.org/2000/svg" width="880" height="612" viewBox="0 0 880 612" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">From licensed provider data to a published, hash-pinned record</title>
<desc id="pipeline-desc">Licensed panels are built and evaluated on one machine and never redistributed; what the repository publishes is aggregates, schemas and SHA-256 pointers, governed by a canonical state that refuses to promote what it cannot support.</desc>
<defs><marker id="head" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6570"/></marker><marker id="head-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e8a33d"/></marker><marker id="head-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#123c69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="56" y="216" width="768" height="216" rx="8" fill="none" stroke="#c9d2da" stroke-width="1.2" stroke-dasharray="6,5"/><rect x="72" y="208" width="296" height="16" fill="#ffffff"/><text x="80" y="220" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.1em">LICENSED PLANE · LOCAL MACHINE ONLY</text>
<rect x="56" y="468" width="768" height="96" rx="8" fill="none" stroke="#e8a33d" stroke-width="1.2" stroke-dasharray="6,5"/><rect x="72" y="460" width="368" height="16" fill="#ffffff"/><text x="80" y="472" fill="#e8a33d" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.1em">PUBLIC PLANE · WHAT THE REPOSITORY PUBLISHES</text>
<line x1="440" y1="180" x2="440" y2="240" stroke="#5a6570" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="452" y="201" width="59" height="18" rx="3" fill="#ffffff"/><text x="460" y="214" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">acquire</text>
<line x1="440" y1="304" x2="440" y2="348" stroke="#5a6570" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="452" y="317" width="127" height="18" rx="3" fill="#ffffff"/><text x="460" y="330" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">one model per step</text>
<line x1="440" y1="412" x2="440" y2="484" stroke="#e8a33d" stroke-width="1.6" marker-end="url(#head-accent)"/>
<rect x="452" y="439" width="109" height="18" rx="3" fill="#ffffff"/><text x="460" y="452" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">freeze and hash</text>
<text x="32" y="30" fill="#7a8593" font-family="'Cascadia Mono','SF Mono',Consolas,monospace" font-size="10" letter-spacing="0.14em">WHERE THE DATA COMES FROM</text><text x="32" y="62" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Two planes, and the line between them</text><text x="32" y="88" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">Licensed panels never leave the machine. What is published is aggregates and hashes.</text>
<rect x="264" y="120" width="352" height="60" rx="6" fill="#ffffff"/><rect x="264" y="120" width="352" height="60" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="440" y="146" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Market data providers</text><text x="440" y="166" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">FMP · Massive · Unusual Whales</text>
<rect x="264" y="244" width="352" height="60" rx="6" fill="#ffffff"/><rect x="264" y="244" width="352" height="60" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="440" y="270" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Point-in-time panel</text><text x="440" y="290" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">what was knowable at the time</text>
<rect x="264" y="352" width="352" height="60" rx="6" fill="#ffffff"/><rect x="264" y="352" width="352" height="60" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1.2"/><text x="440" y="378" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Frozen models and inference</text><text x="440" y="398" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">scored, then error bars</text>
<rect x="264" y="488" width="352" height="60" rx="6" fill="#ffffff"/><rect x="264" y="488" width="352" height="60" rx="6" fill="#fdf6ea" stroke="#e8a33d" stroke-width="1.2"/><text x="440" y="514" fill="#1a2332" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Published record</text><text x="440" y="534" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">summary results and fingerprints</text>
<line x1="32" y1="562" x2="848" y2="562" stroke="#e1e6ea" stroke-width="1"/>
<rect x="32" y="574" width="12" height="12" rx="3" fill="#c9d2da" stroke="none"/><text x="52" y="584" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">stays local</text>
<rect x="130" y="574" width="12" height="12" rx="3" fill="#e8a33d" stroke="none"/><text x="150" y="584" fill="#5a6570" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">leaves the machine</text>
</svg>
