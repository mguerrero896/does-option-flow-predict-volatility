name: Tier 1 CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN is read-write; none of these jobs pushes anything,
# so the token is scoped down to reads (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # Tier 1a — platform-independent static quality.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: tests/test_gated_history_contract.py scans git history for
          # licensed data. Under the default fetch-depth 1 it can only see the tip and
          # would pass on a leak it cannot reach (measured 2026-08-26).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Require Why before What in human PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        run: |
          uv run python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )
          body = re.sub(
              r"<!--.*?-->",
              "",
              event["pull_request"].get("body") or "",
              flags=re.DOTALL,
          )
          headings = [
              line.strip().casefold()
              for line in body.splitlines()
          ]
          try:
              why = headings.index("## why")
              what = headings.index("## what")
          except ValueError as exc:
              raise SystemExit("PR_BODY_REQUIRES_WHY_BEFORE_WHAT") from exc
          if why >= what:
              raise SystemExit("PR_BODY_REQUIRES_WHY_BEFORE_WHAT")
          next_heading = next(
              (
                  index
                  for index, line in enumerate(headings[what + 1 :], what + 1)
                  if line.startswith("## ")
              ),
              len(headings),
          )
          if not "".join(headings[why + 1 : what]) or not "".join(
              headings[what + 1 : next_heading]
          ):
              raise SystemExit("PR_BODY_REQUIRES_NONEMPTY_WHY_AND_WHAT")
          PY
      - name: Shell scripts parse (bash -n; CRLF or syntax breaks fail here)
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Ruff
        run: uv run ruff check src scripts tests
      - name: Mypy (strict)
        run: uv run mypy src scripts
      - name: Scan public checkout, origin and tag history for high-confidence secrets
        run: uv run python scripts/scan_public_secrets.py --include-tags
      - name: Export locked runtime dependencies for audit
        run: >
          uv export --quiet --frozen --no-dev --no-emit-project
          --format requirements.txt
          --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit runtime dependencies
        run: >
          uv run pip-audit --strict --disable-pip
          --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          --progress-spinner off

  # Tier 1b — hermetic test suite: unit + property + synthetic e2e + schema/contract
  # tests that assert only on git-tracked inputs. Evidence-bound tests self-skip
  # (tests/evidence.py). One ignored file hard-requires the local licensed evidence
  # store. Byte-compare contracts run here because their producers emit canonical LF.
  # Tier 2 (full suite + licensed evidence + gated
  # hash verification) runs locally via scripts/run_local_evidence_gates.py before
  # every publish — see docs/ci_contract_v1.md.
  hermetic:
    runs-on: ubuntu-latest
    env:
      # The panel guards read the built RP2 panels, which are licensed-derived and never
      # present on a hosted runner. Until 2026-08-24 they inferred that from a missing
      # file and reported a pass; now the tier boundary is declared here, so a panel
      # missing anywhere else -- a developer's machine, the tier-2 gate runner -- fails.
      MDS650_PANEL_GUARD_MAY_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: tests/test_gated_history_contract.py scans git history for
          # licensed data. Under the default fetch-depth 1 it can only see the tip and
          # would pass on a leak it cannot reach (measured 2026-08-26).
          fetch-depth: 0
      # The mirror guard compares against the published tip. A default shallow
      # checkout leaves no `origin/main` ref, and until 2026-08-24 the guard treated
      # that as a pass. It now fails closed, so the ref has to actually be here.
      #
      # NOT --depth=1: a shallow fetch AFTER a full checkout re-shallows the
      # repository, which silently reduced the history guard to a tree check
      # (caught by that guard's own depth test on 2026-08-26).
      - name: Fetch the published tip the mirror guard checks
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin '+refs/pull/*/head:refs/pull/*/head'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Hermetic pytest with coverage gate
        run: >
          uv run pytest tests -q
          --ignore=tests/unit/test_independent_replication_panel.py
          --cov=src/mds650 --cov-report=term --cov-fail-under=80
      - name: Critical scientific producers have complete branch coverage
        run: >
          uv run coverage report
          --include=src/mds650/date_level_pit_preflight_request_budget_v1.py,src/mds650/temporal_validation.py,src/mds650/b1_replication_common.py,src/mds650/b1_replication_b2.py,src/mds650/b1_replication_build.py,src/mds650/rp3/frozen_forecasters.py,src/mds650/rp2/scorecard.py
          --fail-under=100


  # Tier 1c - the contracts the scientific claims rest on. Separated from `hermetic` so a
  # breach is legible as such in the checks list: a coverage-gate failure and an
  # information set that stopped failing closed are not the same kind of red.
  #
  # Six of these assertions - the per-set panel coverage checks in
  # `test_rp2_v3_feature_registry.py` - skip here, because they read panels built from
  # licensed data that this runner never has. They run where the panels exist, under
  # `scripts/run_local_evidence_gates.py`. A green check here means the contracts that can
  # be checked without the licensed evidence hold; it does not mean coverage was measured.
  scientific-contracts:
    runs-on: ubuntu-latest
    env:
      # The panel guards read the built RP2 panels, which are licensed-derived and never
      # present on a hosted runner. Until 2026-08-24 they inferred that from a missing
      # file and reported a pass; now the tier boundary is declared here, so a panel
      # missing anywhere else -- a developer's machine, the tier-2 gate runner -- fails.
      MDS650_PANEL_GUARD_MAY_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: tests/test_gated_history_contract.py scans git history for
          # licensed data. Under the default fetch-depth 1 it can only see the tip and
          # would pass on a leak it cannot reach (measured 2026-08-26).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: RP2 scientific contracts
        run: >
          uv run pytest
          tests/contract/test_rp2_v3_feature_registry.py
          tests/contract/test_rp2_v3_research_contract.py
          tests/contract/test_rp2_v3_primary_model_producers.py
          tests/e2e/test_rp2_b1_contemporaneous.py
          tests/e2e/test_rp2_b2_point_in_time.py
          tests/e2e/test_rp2_incremental_inference.py
          tests/e2e/test_run_rp2_v3_pipeline.py
          -q
